spring:
  application:
    name: trustspace-backend
  
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1200000
      validation-timeout: 5000
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          
server:
  port: 5000
  error:
    include-message: always
    include-binding-errors: always
    
# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 86400000  # 24 hours
  refresh-token-expiration: 604800000 # 7 days
  
# Cloudinary Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  
# Application Configuration
app:
  frontend-url: "https://trustspace-v1.devanshshrivastava.me"
  verification-url: "https://trustspace-v1.devanshshrivastava.me/verify-email"
  reset-password-url: "https://trustspace-v1.devanshshrivastava.me/reset-password"
  
